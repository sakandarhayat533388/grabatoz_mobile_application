plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "ae.grabatoz1.grabatoz1"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ae.grabatoz1.grabatoz1"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias System.getenv("MY_KEY_ALIAS") ?: MY_KEY_ALIAS
            keyPassword System.getenv("MY_KEY_PASSWORD") ?: MY_KEY_PASSWORD
            storeFile file("../app/upload.jks")
            storePassword System.getenv("MY_KEYSTORE_PASSWORD") ?: MY_KEYSTORE_PASSWORD
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
}

flutter {
    source = "../.."
}

// ---- Bundled notification tones ----
// The tones ship as base64 text (android/app/sounds_b64/*.mp3.b64) because the
// remote file API is text-only. This task decodes them into generated
// resources before every build, so res/raw always contains valid audio.
def notificationSoundsResDir = layout.buildDirectory.dir("generated/notification_sounds/res").get().asFile

tasks.register("decodeNotificationSounds") {
    def rawOutDir = new File(notificationSoundsResDir, "raw")
    outputs.dir(rawOutDir)
    doLast {
        def srcDir = file("sounds_b64")
        rawOutDir.mkdirs()
        srcDir.eachFileMatch(~/.*\.mp3\.b64/) { f ->
            def outFile = new File(rawOutDir, f.name.replace(".b64", ""))
            outFile.bytes = new String(f.bytes, "UTF-8").trim().decodeBase64()
        }
    }
}

android {
    sourceSets {
        main {
            res.srcDirs += notificationSoundsResDir
        }
    }
}

// Make sure the tones are decoded before resources are merged.
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("decodeNotificationSounds")
}
